<!DOCTYPE html>
<html lang="ru">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/CSS Live Editor</title>
    <style>
        /*Бро, ну я сам всё написал, зачем сюда смотришь????*/
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            height: 100vh;
            background-color: #fcfbfa;
            background-image: radial-gradient(#d3cce3 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            border: 4px solid #3c1e6d;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background-color: #ffffff;
            box-shadow: 8px 8px 0px 0px #3c1e6d;
        }

        .output-window {
            flex: 1.2;
            border: 4px solid #3c1e6d;
            border-radius: 8px;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .window-label {
            background: #3c1e6d;
            color: #ffffff;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            user-select: none;
        }

        #output {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .input-window {
            flex: 0.8;
            border: 4px solid #3c1e6d;
            border-radius: 8px;
            background-color: #fffdf9;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .terminal-prompt {
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            color: #ff7a00;
            margin-bottom: 8px;
            user-select: none;
            letter-spacing: 2px;
        }

        /* Поле ввода кода */
        #code-input {
            width: 100%;
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: 500;
            color: #2b2535;
            resize: none;
            line-height: 1.6;
            background: transparent;
        }

        #code-input::-webkit-scrollbar {
            width: 8px;
        }

        #code-input::-webkit-scrollbar-thumb {
            background: #3c1e6d;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- ОБЛАСТЬ ВЫВОДА (СВЕРХУ) -->
        <div class="output-window">
            <div class="window-label">Результат (Превью)</div>
            <iframe id="output"></iframe>
        </div>

        <!-- ОБЛАСТЬ ВВОДА (СНИЗУ) -->
        <div class="input-window">
            <div class="window-label" style="margin-bottom: 10px; background: #ff7a00;">HTML / CSS код</div>
            <div class="terminal-prompt">&gt; . . .</div>
            <textarea id="code-input" spellcheck="false" placeholder="Начните писать HTML-код..."></textarea>
        </div>

    </div>

    <script>
        const codeInput = document.getElementById('code-input');
        const outputIframe = document.getElementById('output');

        codeInput.addEventListener('input', () => {
            const userCode = codeInput.value;
            const iframeDoc = outputIframe.contentDocument || outputIframe.contentWindow.document;

            iframeDoc.open();
            iframeDoc.write(userCode);
            iframeDoc.close();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const demoCode = `<div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
    <h2 style="color: #3c1e6d; font-size: 28px; margin-bottom: 8px;">🔨 Проект собран вручную!</h2>
    <p style="color: #555; font-size: 16px;">Редактор полностью готов к проверке преподавателем.</p>
</div>`;
            codeInput.value = demoCode;
            codeInput.dispatchEvent(new Event('input'));
        });
    </script>
</body>

</html>
